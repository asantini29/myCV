# Talks and posters, shown on the CV and on the website's Talks page in the
# order listed (newest first within each type).
#
# Each entry needs: type, event, title, date
#   type: invited | contributed | poster
#         invited → conferences.tex; contributed and poster → conferences-contributed.tex
#         (dropped from the short CV)
# Optional: location
#           format   (e.g. "panel session"; printed after the title)
#           website  (false hides the entry on the website only)
#           url, slides, video   (website only: buttons under the entry)
#
# Text: $...$ for math and -- for dashes, as in LaTeX; **bold** and
# [text](url) as in Markdown. Quote a value that contains ": ".

